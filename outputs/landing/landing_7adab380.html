<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #1a73e8 0%, #e8f0fe 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 3rem;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #1a73e8;
        }
        .body-content {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
        }
        .cta-button {
            display: inline-block;
            background: #1a73e8;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        .footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #999;
            text-align: center;
        }
        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test</h1>
        <div class="body-content"><p>Content</p></div>
        <a href="#" class="cta-button">立即体验</a>
        <div class="footer">ReAgent &middot; Powered by ReAgent</div>
    </div>
</body>
</html>
