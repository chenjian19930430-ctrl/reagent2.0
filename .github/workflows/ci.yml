# =============================================================================
# ReAgent · CI Pipeline
# =============================================================================
# Runs on every push/PR to main branches.
# Stages: Lint → Test → Build
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: ruff check reagent/ tests/

      - name: Ruff format check
        run: ruff format --check reagent/ tests/

      - name: MyPy (strict)
        run: mypy --strict reagent/
        continue-on-error: true  # allow type-checking to fail without blocking

  test:
    name: 🧪 Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Install FFmpeg (for content tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v --cov=reagent --cov-report=term-missing --cov-report=xml
        env:
          REAGENT_DEBUG: false
          REAGENT_LOG_LEVEL: WARNING
          REAGENT_OPENAI_API_KEY: "sk-test-fake"
          REAGENT_ANTHROPIC_API_KEY: "sk-ant-test-fake"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  docker:
    name: 🐳 Docker Image Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: reagent:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

